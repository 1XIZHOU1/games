<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的小游戏">
<title>我的小游戏</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;background:#0a0b14;color:#eef2ff;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:calc(40px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));
    background-image:
      radial-gradient(800px 520px at 12% -8%, rgba(60,120,255,.22), transparent 60%),
      radial-gradient(700px 480px at 100% 108%, rgba(140,60,220,.20), transparent 60%);
  }
  h1{font-size:26px;font-weight:900;letter-spacing:.06em;text-align:center;
    background:linear-gradient(180deg,#cfe9ff,#5fd4ff 60%,#3a7bff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  p.sub{text-align:center;font-size:11px;letter-spacing:.34em;color:rgba(238,242,255,.4);margin:10px 0 34px}
  a.card{display:block;text-decoration:none;color:inherit;margin-bottom:14px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
    border-radius:18px;padding:20px 18px;transition:transform .1s,background .2s}
  a.card:active{transform:scale(.985);background:rgba(255,255,255,.08)}
  .card .t{font-size:18px;font-weight:800;letter-spacing:.02em}
  .card .d{font-size:12.5px;color:rgba(238,242,255,.5);margin-top:7px;line-height:1.6}
  .tag{display:inline-block;font-size:10.5px;letter-spacing:.1em;padding:3px 9px;border-radius:99px;
    margin-bottom:10px;color:#5fd4ff;background:rgba(95,212,255,.10);border:1px solid rgba(95,212,255,.22)}
  .tag.b{color:#ff8fd0;background:rgba(255,143,208,.10);border-color:rgba(255,143,208,.22)}
  footer{text-align:center;font-size:11px;color:rgba(238,242,255,.3);line-height:1.9;margin-top:26px}
</style>
</head>
<body>
  <h1>我的小游戏</h1>
  <p class="sub">L O C A L &nbsp; P L A Y</p>

  <a class="card" href="./cet6-raid.html">
    <span class="tag">学习</span>
    <div class="t">六级突袭</div>
    <div class="d">3991 个六级词 · 四种玩法 · 拼写 / 例句填空 / 错词本</div>
  </a>

  <a class="card" href="./star-defender.html">
    <span class="tag b">街机</span>
    <div class="t">星际守卫</div>
    <div class="d">拖动射击 · 三种敌机 · 每 5 波一个 BOSS</div>
  </a>

  <footer>
    点右上角「分享 → 添加到主屏幕」，下次一个图标直接进<br>
    离线可玩 · 进度存在本机
  </footer>
</body>
</html>
