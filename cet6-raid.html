<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>六级突袭 CET-6 Raid</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0b14;
    --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
    --txt:#eef2ff;
    --dim:rgba(238,242,255,.45);
    --cyan:#5fd4ff;
    --green:#5df2a8;
    --red:#ff6b81;
    --amber:#ffc857;
  }
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
    background:
      radial-gradient(900px 600px at 15% -10%, rgba(60,120,255,.20), transparent 60%),
      radial-gradient(700px 500px at 100% 110%, rgba(140,60,220,.18), transparent 60%),
      var(--bg);
    padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(16px + env(safe-area-inset-bottom,0px));
    overflow:hidden}
  .screen{flex:1;display:flex;flex-direction:column;min-height:0}
  .hidden{display:none!important}

  /* ---------- 菜单 ---------- */
  .brand{text-align:center;margin-top:clamp(10px,6vh,60px)}
  .brand h1{font-size:clamp(30px,9vw,42px);font-weight:900;letter-spacing:.10em;
    background:linear-gradient(180deg,#cfe9ff,#5fd4ff 55%,#3a7bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 20px rgba(95,212,255,.35))}
  .brand p{font-size:11px;letter-spacing:.42em;color:var(--dim);margin-top:8px}

  .stats{margin:clamp(16px,3.5vh,28px) 0 6px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:14px 16px}
  .stat-row{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);
    letter-spacing:.04em;margin-bottom:8px}
  .stat-row b{color:var(--txt);font-variant-numeric:tabular-nums;font-size:13px}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .4s}
  .bar.sub{margin-top:10px}
  .bar.sub>i{background:linear-gradient(90deg,#8b7dff,var(--cyan))}

  .modes{display:flex;flex-direction:column;gap:10px;margin-top:clamp(14px,3vh,22px)}
  .mode{display:flex;align-items:center;gap:14px;text-align:left;width:100%;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
    color:var(--txt);font-family:inherit;transition:transform .1s,border-color .2s,background .2s}
  .mode:active{transform:scale(.985);background:rgba(255,255,255,.08)}
  .mode .ico{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:flex;
    align-items:center;justify-content:center;font-size:15px;font-weight:800;
    background:rgba(95,212,255,.12);color:var(--cyan)}
  .mode .ico.b{background:rgba(93,242,168,.12);color:var(--green)}
  .mode .ico.c{background:rgba(255,200,87,.12);color:var(--amber)}
  .mode .t{font-size:15px;font-weight:700;letter-spacing:.02em}
  .mode .d{font-size:11.5px;color:var(--dim);margin-top:3px}
  .mode .go{margin-left:auto;color:var(--dim);font-size:18px}

  .foot{margin-top:auto;padding-top:14px;display:flex;gap:8px}
  .chip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 8px;font-size:12px;color:var(--dim);text-align:center;cursor:pointer;
    font-family:inherit;transition:background .2s}
  .chip.on{color:var(--txt);border-color:rgba(95,212,255,.35);background:rgba(95,212,255,.08)}
  .chip b{color:var(--txt)}

  /* ---------- 游戏 ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;font-size:12px;
    color:var(--dim);letter-spacing:.06em}
  .hearts{font-size:14px;letter-spacing:2px;color:var(--red)}
  .combo{font-size:14px;font-weight:800;color:var(--amber);min-width:44px;text-align:right;
    transition:transform .15s}
  .combo.pop{transform:scale(1.35)}
  .timer{height:5px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:12px;overflow:hidden}
  .timer>i{display:block;height:100%;width:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--cyan),#7b6bff)}
  .timer>i.warn{background:linear-gradient(90deg,var(--red),var(--amber))}

  .card{margin-top:auto;background:var(--card);border:1px solid var(--line);
    border-radius:22px;padding:clamp(20px,5vh,34px) 20px;text-align:center;
    min-height:clamp(150px,26vh,230px);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px}
  .word{font-size:clamp(30px,9vw,46px);font-weight:800;letter-spacing:.02em;line-height:1.15;
    word-break:break-word}
  .word.zh{font-size:clamp(22px,6.4vw,32px);font-weight:700;line-height:1.45;letter-spacing:.01em}
  .ipa{font-size:13px;color:var(--dim);letter-spacing:.02em}
  .hintline{font-size:12px;color:var(--dim);letter-spacing:.08em}
  .speak{width:34px;height:34px;border-radius:50%;border:1px solid rgba(95,212,255,.3);
    background:rgba(95,212,255,.10);color:var(--cyan);font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;margin-top:2px}
  .speak:active{transform:scale(.92)}
  .sentence{font-size:clamp(16px,4.6vw,21px);line-height:1.65;font-weight:600;text-align:left;
    color:#dbe6ff}
  .sentence em{font-style:normal;color:var(--cyan);border-bottom:2px dashed rgba(95,212,255,.6);
    padding:0 2px}
  .zh-sent{font-size:12.5px;color:var(--dim);line-height:1.7;text-align:left;margin-top:2px}

  .options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:clamp(14px,3vh,20px);margin-bottom:auto}
  @media (min-width:520px){ .options{grid-template-columns:1fr 1fr} }
  .opt{position:relative;text-align:left;cursor:pointer;font-family:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 15px;color:var(--txt);font-size:15px;line-height:1.45;
    transition:background .15s,border-color .15s,transform .1s}
  .opt:active{transform:scale(.985)}
  .opt .num{display:inline-block;width:20px;color:var(--dim);font-size:12px;font-weight:700}
  .opt.right{border-color:rgba(93,242,168,.7);background:rgba(93,242,168,.13);
    box-shadow:0 0 0 1px rgba(93,242,168,.35),0 8px 26px rgba(93,242,168,.12)}
  .opt.wrong{border-color:rgba(255,107,129,.7);background:rgba(255,107,129,.12)}
  .opt:disabled{cursor:default}

  /* ---------- 拼写模式 ---------- */
  .mode .ico.d{background:rgba(255,120,200,.14);color:#ff8fd0}
  #s-menu{overflow-y:auto}
  .spellwrap{grid-column:1/-1}
  .spellInput{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-radius:14px;padding:16px;font-size:20px;font-weight:700;color:var(--txt);
    font-family:inherit;letter-spacing:.06em;text-align:center;outline:none;
    transition:border-color .15s,background .15s}
  .spellInput::placeholder{color:rgba(238,242,255,.25);font-size:13.5px;font-weight:500;letter-spacing:.02em}
  .spellInput:focus{border-color:rgba(95,212,255,.6);box-shadow:0 0 0 3px rgba(95,212,255,.12)}
  .spellInput.ok{border-color:rgba(93,242,168,.8);color:var(--green);background:rgba(93,242,168,.10)}
  .spellInput.bad{border-color:rgba(255,107,129,.8);color:var(--red);background:rgba(255,107,129,.10)}
  .spellhint{margin-top:11px;text-align:center;font-size:13px;color:var(--dim);letter-spacing:.14em;min-height:20px}
  .spellrow{grid-column:1/-1;display:flex;gap:10px;margin-top:2px}
  .spellrow .btn{padding:14px 10px}

  .toast{position:fixed;left:50%;top:calc(18% + env(safe-area-inset-top,0px));transform:translate(-50%,0);
    font-size:22px;font-weight:900;letter-spacing:.06em;pointer-events:none;opacity:0;
    transition:opacity .2s,transform .3s}
  .toast.show{opacity:1;transform:translate(-50%,-14px)}
  .toast.good{color:var(--green);text-shadow:0 0 24px rgba(93,242,168,.6)}
  .toast.bad{color:var(--red);text-shadow:0 0 24px rgba(255,107,129,.6)}

  /* ---------- 结算 ---------- */
  .result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:6px}
  .result .lbl{font-size:12px;letter-spacing:.3em;color:var(--dim)}
  .result .score{font-size:60px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;
    background:linear-gradient(180deg,#fff,var(--cyan));-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .result .sub{font-size:13px;color:var(--dim);margin-top:2px}
  .result .new{margin-top:10px;font-size:13px;color:var(--green);letter-spacing:.04em}
  .wronglist{width:100%;max-height:26vh;overflow:auto;margin-top:16px;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
  .wrow{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);
    font-size:13px}
  .wrow:last-child{border-bottom:none}
  .wrow b{font-size:14px;font-weight:700;min-width:0}
  .wrow span{color:var(--dim);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .actions{display:flex;gap:10px;width:100%;margin-top:18px}
  .actions>.btn{flex:1}
  .btn{flex:0 0 auto;border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:15px;
    letter-spacing:.10em;padding:15px 10px;border-radius:14px;color:#03121f;
    background:linear-gradient(180deg,#8fe4ff,#39a8ff);
    box-shadow:0 8px 26px rgba(57,168,255,.28)}
  .btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line);box-shadow:none}
  .btn:active{transform:scale(.98)}

  /* ---------- 错词本 ---------- */
  .listhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .listhead h2{font-size:17px;font-weight:800;letter-spacing:.06em}
  .listhead .count{font-size:12px;color:var(--dim)}
  .listhead button{margin-left:auto;background:none;border:none;color:var(--dim);
    font-size:12px;cursor:pointer;font-family:inherit;padding:6px}
  .wlist{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px 14px}
  .witem{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .witem:last-child{border-bottom:none}
  .witem .wt{font-size:14.5px;font-weight:700}
  .witem .wm{font-size:12px;color:var(--dim);margin-top:2px}
  .witem .sp{margin-left:auto;color:var(--cyan);font-size:15px;cursor:pointer;padding:4px}
  .empty{text-align:center;color:var(--dim);font-size:13px;padding:40px 0;line-height:2}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 菜单 ============ -->
  <section class="screen" id="s-menu">
    <div class="brand">
      <h1>六级突袭</h1>
      <p>C E T - 6 &nbsp; R A I D</p>
    </div>

    <div class="stats">
      <div class="stat-row"><span>今日目标</span><b><span id="todayN">0</span> / <span id="goalN">30</span> 题</b></div>
      <div class="bar"><i id="todayBar" style="width:0%"></i></div>
      <div class="stat-row" style="margin-top:12px"><span>已掌握</span>
        <b><span id="masterN">0</span> / <span id="totalN">0</span></b></div>
      <div class="bar sub"><i id="masterBar" style="width:0%"></i></div>
    </div>

    <div class="modes">
      <button class="mode" data-mode="en2zh">
        <div class="ico">A</div>
        <div><div class="t">英 → 中</div><div class="d">看单词选释义，认得越快分越高</div></div>
        <div class="go">›</div>
      </button>
      <button class="mode" data-mode="zh2en">
        <div class="ico b">中</div>
        <div><div class="t">中 → 英</div><div class="d">看释义选单词，逼自己想出来</div></div>
        <div class="go">›</div>
      </button>
      <button class="mode" data-mode="cloze">
        <div class="ico c">▭</div>
        <div><div class="t">例句填空</div><div class="d">真题式语境，挖掉的那个词</div></div>
        <div class="go">›</div>
      </button>
      <button class="mode" data-mode="spell">
        <div class="ico d">✎</div>
        <div><div class="t">拼写</div><div class="d">看释义默写单词，写得出才算会</div></div>
        <div class="go">›</div>
      </button>
    </div>

    <div class="foot">
      <button class="chip" id="btnReview">错词本 <b id="wrongN">0</b></button>
      <button class="chip on" id="btnSound">音效</button>
      <button class="chip on" id="btnAuto">自动发音</button>
    </div>
  </section>

  <!-- ============ 游戏 ============ -->
  <section class="screen hidden" id="s-play">
    <div class="top">
      <div id="qIndex">第 1 / 10 题</div>
      <div class="hearts" id="hearts">♥♥♥</div>
      <div class="combo" id="combo">x1</div>
    </div>
    <div class="timer"><i id="timerBar"></i></div>

    <div class="card" id="card"></div>
    <div class="options" id="options"></div>
  </section>

  <!-- ============ 结算 ============ -->
  <section class="screen hidden" id="s-result">
    <div class="result">
      <div class="lbl">S C O R E</div>
      <div class="score" id="resScore">0</div>
      <div class="sub" id="resSub">正确 0 / 10 · 最高连击 x1</div>
      <div class="new" id="resNew"></div>
      <div class="wronglist hidden" id="resWrong"></div>
      <div class="actions">
        <button class="btn" id="btnAgain">再来一局</button>
        <button class="btn ghost" id="btnRetryWrong">练错词</button>
      </div>
      <button class="btn ghost" id="btnHome" style="width:100%;margin-top:10px">回首页</button>
    </div>
  </section>

  <!-- ============ 错词本 ============ -->
  <section class="screen hidden" id="s-review">
    <div class="listhead">
      <h2>错词本</h2>
      <span class="count" id="revCount"></span>
      <button id="btnClearWrong">清空</button>
      <button id="btnCloseReview">关闭</button>
    </div>
    <div class="wlist" id="wlist"></div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
'use strict';

/* ---------------- 数据 ---------------- */
var RAW = document.getElementById('data').textContent;

// 合并过的词条里可能有重复释义段，这里去掉完全重复的
function dedupeSeg(s){
  var parts = String(s).split('；'), out = [], seen = {};
  for (var i = 0; i < parts.length; i++){
    var p = parts[i];
    if (!p || seen[p]) continue;
    seen[p] = 1; out.push(p);
  }
  return out.join('；');
}

var WORDS = [];
(function parse(){
  var lines = RAW.split('\n');
  for (var i = 0; i < lines.length; i++){
    var l = lines[i];
    if (!l) continue;
    var f = l.split('\t');
    if (f.length < 3 || !f[0]) continue;
    WORDS.push({ w: f[0], s: f[1] || f[2], m: dedupeSeg(f[2] || f[1]), ipa: f[3] || '', en: f[4] || '', zh: f[5] || '' });
  }
})();
var TOTAL = WORDS.length;
if (!TOTAL){
  try {
    document.body.innerHTML = '<div style="padding:48px 24px;font-family:system-ui;color:#eef2ff;background:#0a0b14;min-height:100vh">' +
      '<div style="font-size:20px;font-weight:800;margin-bottom:10px">词库没加载出来</div>' +
      '<div style="font-size:14px;line-height:1.9;color:#9aa7c7">这个 HTML 文件可能在传输中损坏了。<br>重新复制一份完整文件再打开就好。</div></div>';
  } catch(e){}
  return;
}

var $ = function(id){ return document.getElementById(id); };
var el = {
  menu: $('s-menu'), play: $('s-play'), result: $('s-result'), review: $('s-review'),
  todayN: $('todayN'), goalN: $('goalN'), todayBar: $('todayBar'),
  masterN: $('masterN'), totalN: $('totalN'), masterBar: $('masterBar'),
  wrongN: $('wrongN'),
  qIndex: $('qIndex'), hearts: $('hearts'), combo: $('combo'),
  timerBar: $('timerBar'), card: $('card'), options: $('options'),
  resScore: $('resScore'), resSub: $('resSub'), resNew: $('resNew'), resWrong: $('resWrong'),
  revCount: $('revCount'), wlist: $('wlist'), toast: $('toast')
};

/* ---------------- 存档 ---------------- */
var KEY = 'cet6_raid_v1';
var DB = { rec: {}, day: { d: '', n: 0, r: 0 }, stats: { total: 0, right: 0 } };
var opt = { sound: true, autoSpeak: true, goal: 30 };

function todayKey(){
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (raw){
      var o = JSON.parse(raw);
      if (o && o.rec) DB.rec = o.rec;
      if (o && o.day) DB.day = o.day;
      if (o && o.stats) DB.stats = o.stats;
      if (o && o.opt) { opt.sound = o.opt.sound !== false; opt.autoSpeak = o.opt.autoSpeak !== false; }
    }
  } catch(e){}
  if (DB.day.d !== todayKey()) DB.day = { d: todayKey(), n: 0, r: 0 };
}
function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify({
      rec: DB.rec, day: DB.day, stats: DB.stats,
      opt: { sound: opt.sound, autoSpeak: opt.autoSpeak }
    }));
  } catch(e){}
}
function rec(w){
  if (!DB.rec[w]) DB.rec[w] = { s: 0, r: 0, w: 0 };
  return DB.rec[w];
}
function isMastered(w){
  var r = DB.rec[w];
  return !!r && r.r >= 3;
}
function masteredCount(){
  var n = 0;
  for (var k in DB.rec) if (DB.rec[k].r >= 3) n++;
  return n;
}
function wrongWords(){
  var out = [];
  for (var k in DB.rec){
    var r = DB.rec[k];
    if (r.w > 0 && r.r < 3) out.push(k);
  }
  return out;
}

/* ---------------- 音效 ---------------- */
var actx = null;
function ensureAudio(){
  try {
    if (!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch(e){}
}
function beep(freq, dur, type, vol, slide){
  if (!opt.sound || !actx) return;
  try {
    var t0 = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch(e){}
}
var SFX = {
  right: function(){ beep(660, 0.09, 'sine', 0.06, 990); },
  wrong: function(){ beep(180, 0.26, 'sawtooth', 0.05, 90); },
  tick:  function(){ beep(1100, 0.03, 'square', 0.012); },
  end:   function(){ beep(520, 0.18, 'sine', 0.06, 780); }
};

/* ---------------- 朗读 ---------------- */
var voice = null;
function pickVoice(){
  try {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    for (var i = 0; i < vs.length; i++){
      if (/en[-_]US/i.test(vs[i].lang)) { voice = vs[i]; return; }
    }
    for (var j = 0; j < vs.length; j++){
      if (/^en/i.test(vs[j].lang)) { voice = vs[j]; return; }
    }
  } catch(e){}
}
if (window.speechSynthesis){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if (!window.speechSynthesis || !text) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.92;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch(e){}
}

/* ---------------- 工具 ---------------- */
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function esc(s){
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function toast(txt, good){
  el.toast.textContent = txt;
  el.toast.className = 'toast show ' + (good ? 'good' : 'bad');
  setTimeout(function(){ el.toast.className = 'toast ' + (good ? 'good' : 'bad'); }, 620);
}

/* ---------------- 抽词 ---------------- */
var POOL = null;
function buildWeights(){
  POOL = null;
}
function weightOf(word){
  var r = DB.rec[word.w];
  if (!r) return 3.0;                       // 新词优先
  if (r.r >= 3) return 0.25;                // 已掌握，偶尔复习
  var s = 1.2 + r.w * 1.8 - Math.min(r.r, 3) * 0.55;
  return Math.max(0.35, s);
}
function pickWord(usedSet, needSentence){
  var total = 0, i, w;
  var arr = [];
  for (i = 0; i < TOTAL; i++){
    w = WORDS[i];
    if (needSentence && !w.en) continue;
    if (usedSet && usedSet[w.w]) continue;
    var wt = weightOf(w);
    arr.push([i, wt]);
    total += wt;
  }
  if (!arr.length) return WORDS[Math.floor(Math.random() * TOTAL)];
  var r = Math.random() * total;
  for (i = 0; i < arr.length; i++){
    r -= arr[i][1];
    if (r <= 0) return WORDS[arr[i][0]];
  }
  return WORDS[arr[arr.length - 1][0]];
}

/* ---------------- 出题 ---------------- */
function makeOptions(correct, field, n){
  var seen = {}, out = [correct];
  seen[correct[field]] = 1;
  var guard = 0;
  while (out.length < n && guard++ < 400){
    var c = WORDS[Math.floor(Math.random() * TOTAL)];
    if (c === correct) continue;
    var v = c[field];
    if (!v || seen[v]) continue;
    // 避免释义互为子串（"一致的" vs "一致的，连贯的"）
    var dup = false;
    for (var k in seen){
      if (k.indexOf(v) >= 0 || v.indexOf(k) >= 0){ dup = true; break; }
    }
    if (dup) continue;
    seen[v] = 1;
    out.push(c);
  }
  return shuffle(out);
}

var session = null;
var cur = null;
var locked = false;
var rafId = 0;

function startSession(mode, onlyWrong){
  ensureAudio();
  var pool = onlyWrong ? wrongWords() : null;
  if (onlyWrong && (!pool || !pool.length)) pool = null;
  session = {
    mode: mode, onlyWrong: !!pool, wrongPool: pool,
    score: 0, lives: 3, idx: 0,
    total: pool ? Math.max(1, Math.min(10, pool.length)) : 10,
    qt: mode === 'spell' ? 20 : 12,
    right: 0, wrong: 0, streak: 0, maxStreak: 0,
    used: {}, wrongList: [], newMastered: 0, t0: 0, hintsUsed: 0
  };
  show(el.play);
  nextQuestion();
}

function nextQuestion(){
  locked = false;
  if (session.idx >= session.total || session.lives <= 0){ endSession(); return; }
  session.idx++;

  var needSent = session.mode === 'cloze';
  var word;
  if (session.onlyWrong && session.wrongPool && session.wrongPool.length){
    var avail = [];
    for (var a = 0; a < session.wrongPool.length; a++){
      var k0 = session.wrongPool[a];
      if (!session.used[k0] && findWord(k0)) avail.push(k0);
    }
    if (!avail.length) avail = session.wrongPool.slice();
    var pickKey = avail[Math.floor(Math.random() * avail.length)];
    word = findWord(pickKey) || pickWord(session.used, needSent);
  } else {
    word = pickWord(session.used, needSent);
  }
  session.used[word.w] = 1;

  var q = { word: word, mode: session.mode, options: [], answer: 0 };
  var field = session.mode === 'en2zh' ? 's' : 'w';
  var opts = makeOptions(word, field, 4);
  q.options = opts;
  q.answer = opts.indexOf(word);

  cur = q;
  renderQuestion();
  startTimer();
}

function renderQuestion(){
  var q = cur, w = q.word;
  el.qIndex.textContent = '第 ' + session.idx + ' / ' + session.total + ' 题';

  var h = '';
  if (q.mode === 'en2zh'){
    h += '<div class="word">' + w.w + '</div>';
    if (w.ipa) h += '<div class="ipa">' + w.ipa + '</div>';
    h += '<button class="speak" id="btnSpeak">🔊</button>';
  } else if (q.mode === 'zh2en'){
    h += '<div class="word zh">' + w.m + '</div>';
    h += '<div class="hintline">选出对应的英文单词</div>';
  } else if (q.mode === 'spell'){
    h += '<div class="word zh">' + w.m + '</div>';
    if (w.ipa) h += '<div class="ipa">' + w.ipa + '</div>';
    h += '<button class="speak" id="btnSpeak">🔊</button>';
  } else {
    var s = w.en || '';
    var re = new RegExp('\\b' + esc(w.w) + '[a-zA-Z]{0,3}\\b', 'i');
    if (re.test(s)) s = s.replace(re, '<em>＿＿＿＿</em>');
    h += '<div class="sentence">' + s + '</div>';
    if (w.zh) h += '<div class="zh-sent">' + w.zh + '</div>';
  }
  el.card.innerHTML = h;

  var sp = $('btnSpeak');
  if (sp) sp.onclick = function(){ speak(w.w); };

  if (q.mode === 'spell'){
    renderSpellUI(w);
    updateHearts();
    updateCombo(0);
    return;
  }

  var oh = '';
  for (var i = 0; i < q.options.length; i++){
    var o = q.options[i];
    oh += '<button class="opt" data-i="' + i + '"><span class="num">' + (i + 1) + '</span>' +
      (q.mode === 'en2zh' ? o.s : o.w) + '</button>';
  }
  el.options.innerHTML = oh;
  var btns = el.options.querySelectorAll('.opt');
  for (var k = 0; k < btns.length; k++){
    btns[k].onclick = function(){ answer(parseInt(this.getAttribute('data-i'), 10)); };
  }

  updateHearts();
  updateCombo(0);

  if (opt.autoSpeak && (q.mode === 'en2zh' || q.mode === 'cloze')) speak(w.w);
}

function updateHearts(){
  var h = '';
  for (var i = 0; i < 3; i++) h += (i < session.lives ? '♥' : '♡');
  el.hearts.textContent = h;
}
function updateCombo(pop){
  var c = Math.min(2.0, 1 + session.streak * 0.2);
  el.combo.textContent = 'x' + (Math.round(c * 10) / 10);
  if (pop){
    el.combo.classList.add('pop');
    setTimeout(function(){ el.combo.classList.remove('pop'); }, 160);
  }
}

/* ---------------- 计时 ---------------- */
function startTimer(){
  session.qStart = performance.now();
  session.qLeft = session.qt;
  el.timerBar.style.width = '100%';
  el.timerBar.classList.remove('warn');
}
function tickTimer(){
  if (!session || locked || !session.qStart) return;
  var el2 = (performance.now() - session.qStart) / 1000;
  var left = Math.max(0, session.qt - el2);
  session.qLeft = left;
  var pct = (left / session.qt) * 100;
  el.timerBar.style.width = pct.toFixed(1) + '%';
  if (left <= 3) el.timerBar.classList.add('warn');
  if (left <= 0){
    if (session.mode === 'spell') submitSpell(true);
    else answer(-1);
  }
}

/* ---------------- 拼写模式 ---------------- */
function maskHint(word, revealCount){
  var s = word.slice(0, revealCount);
  var rest = '';
  for (var i = revealCount; i < word.length; i++) rest += ' _';
  return s + rest + '　' + word.length + ' 个字母';
}

function renderSpellUI(w){
  var first = w.w.charAt(0).toLowerCase();
  el.options.innerHTML =
    '<div class="spellwrap">' +
      '<input id="spellInput" class="spellInput" type="text" autocomplete="off" autocorrect="off" ' +
        'autocapitalize="off" spellcheck="false" placeholder="输入英文单词，回车提交">' +
      '<div class="spellhint" id="spellHint">' + maskHint(w.w.toLowerCase(), 1) + '</div>' +
    '</div>' +
    '<div class="spellrow">' +
      '<button class="btn ghost" id="btnHint">提示字母</button>' +
      '<button class="btn" id="btnSubmit">提交</button>' +
    '</div>';

  session.hintsUsed = 0;
  var inp = $('spellInput');
  if (inp){
    inp.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); submitSpell(false); }
    });
    setTimeout(function(){ try { inp.focus(); } catch(e){} }, 80);
  }
  $('btnSubmit').onclick = function(){ submitSpell(false); };
  $('btnHint').onclick = function(){
    if (locked || !cur) return;
    if (session.hintsUsed >= 2){ return; }
    session.hintsUsed++;
    $('spellHint').textContent = maskHint(cur.word.w.toLowerCase(), 1 + session.hintsUsed);
    SFX.tick();
  };
}

function submitSpell(timedOut){
  if (locked || !cur) return;
  var q = cur, w = q.word;
  var inp = $('spellInput');
  var val = inp ? String(inp.value || '').trim().toLowerCase() : '';
  if (!val && !timedOut) return;

  locked = true;
  var ok = val === w.w.toLowerCase();

  if (inp){
    inp.disabled = true;
    inp.classList.add(ok ? 'ok' : 'bad');
  }
  if (ok){
    toast('✓ 拼对了', true);
  } else {
    var hi = $('spellHint');
    if (hi) hi.innerHTML = '正确答案 <b style="color:var(--green);font-size:16px">' + w.w + '</b>';
    toast(timedOut ? '超时' : '×', false);
    speak(w.w);
  }
  finishQuestion(ok, { spell: true, hint: session.hintsUsed });
}

/* ---------------- 判定 ---------------- */
function answer(i){
  if (locked || !cur) return;
  locked = true;

  var q = cur, w = q.word;
  var correct = i === q.answer;
  var btns = el.options.querySelectorAll('.opt');
  for (var k = 0; k < btns.length; k++){
    btns[k].disabled = true;
    if (k === q.answer) btns[k].classList.add('right');
    else if (k === i) btns[k].classList.add('wrong');
  }

  if (!correct){
    toast(i === -1 ? '超时' : '×', false);
    if (q.mode !== 'en2zh') speak(w.w);
  }
  finishQuestion(correct, {});
}

function finishQuestion(correct, meta){
  var q = cur, w = q.word;
  var r = rec(w.w);
  r.s++;
  DB.stats.total++;
  DB.day.n++;

  if (correct){
    session.right++;
    session.streak++;
    DB.stats.right++;
    DB.day.r++;
    if (session.streak > session.maxStreak) session.maxStreak = session.streak;

    var wasMastered = r.r >= 3;
    r.r++;
    if (!wasMastered && r.r >= 3) session.newMastered++;

    var mult = Math.min(2.0, 1 + (session.streak - 1) * 0.2);
    var base = (meta && meta.spell) ? 16 : 10;
    var pts = Math.round((base + session.qLeft * 1.1) * mult);
    if (meta && meta.hint) pts = Math.max(4, pts - 5 * meta.hint);
    session.score += pts;
    SFX.right();
    toast('+' + pts, true);
    updateCombo(1);
  } else {
    session.wrong++;
    session.streak = 0;
    session.lives--;
    r.w++;
    if (session.wrongList.indexOf(w.w) < 0) session.wrongList.push(w.w);
    SFX.wrong();
    updateCombo(0);
  }

  updateHearts();
  save();

  setTimeout(function(){
    if (session.lives <= 0) { endSession(); return; }
    if (session.idx >= session.total) { endSession(); return; }
    nextQuestion();
  }, correct ? 780 : 1500);
}

/* ---------------- 结算 ---------------- */
function endSession(){
  locked = true;
  SFX.end();
  el.resScore.textContent = session.score;
  var acc = session.right + session.wrong ? Math.round(session.right / (session.right + session.wrong) * 100) : 0;
  el.resSub.textContent = '正确 ' + session.right + ' / ' + (session.right + session.wrong) +
    ' · 正确率 ' + acc + '% · 最高连击 x' + Math.min(2, 1 + session.maxStreak * 0.2).toFixed(1);
  el.resNew.textContent = session.newMastered > 0 ? ('新掌握 ' + session.newMastered + ' 个词') : '';

  var wl = session.wrongList;
  if (wl.length){
    var h = '<div style="font-size:11px;color:var(--dim);letter-spacing:.14em;padding:10px 0 4px">本 局 错 词</div>';
    for (var i = 0; i < wl.length; i++){
      var w = findWord(wl[i]);
      if (!w) continue;
      h += '<div class="wrow"><b>' + w.w + '</b><span>' + w.s + '</span></div>';
    }
    el.resWrong.innerHTML = h;
    el.resWrong.classList.remove('hidden');
  } else {
    el.resWrong.classList.add('hidden');
  }
  $('btnRetryWrong').style.display = wl.length ? '' : 'none';
  show(el.result);
  refreshMenu();
}

function findWord(w){
  if (!findWord.map) findWord.map = null;
  if (!findWord.map){
    findWord.map = {};
    for (var i = 0; i < TOTAL; i++) findWord.map[WORDS[i].w] = WORDS[i];
  }
  return findWord.map[w];
}

/* ---------------- 菜单刷新 ---------------- */
function refreshMenu(){
  var g = opt.goal;
  el.todayN.textContent = DB.day.n;
  el.goalN.textContent = g;
  el.todayBar.style.width = Math.min(100, DB.day.n / g * 100) + '%';
  var m = masteredCount();
  el.masterN.textContent = m;
  el.totalN.textContent = TOTAL;
  el.masterBar.style.width = Math.min(100, m / TOTAL * 100) + '%';
  el.wrongN.textContent = wrongWords().length;
}

function show(scr){
  el.menu.classList.add('hidden');
  el.play.classList.add('hidden');
  el.result.classList.add('hidden');
  el.review.classList.add('hidden');
  scr.classList.remove('hidden');
}

/* ---------------- 错词本 ---------------- */
function renderReview(){
  var list = wrongWords();
  el.revCount.textContent = list.length ? (list.length + ' 个') : '';
  if (!list.length){
    el.wlist.innerHTML = '<div class="empty">还没有错词<br>答错或超时的词会出现在这里</div>';
    show(el.review);
    return;
  }
  list.sort(function(a, b){ return (DB.rec[b].w - DB.rec[a].w); });
  var h = '';
  for (var i = 0; i < list.length; i++){
    var w = findWord(list[i]);
    if (!w) continue;
    h += '<div class="witem"><div><div class="wt">' + w.w + '</div><div class="wm">' + w.s + '</div></div>' +
      '<div class="sp" data-w="' + w.w + '">🔊</div></div>';
  }
  el.wlist.innerHTML = h;
  var sps = el.wlist.querySelectorAll('.sp');
  for (var k = 0; k < sps.length; k++){
    sps[k].onclick = function(){ speak(this.getAttribute('data-w')); };
  }
  show(el.review);
}

/* ---------------- 事件 ---------------- */
var modes = document.querySelectorAll('.mode');
for (var i = 0; i < modes.length; i++){
  modes[i].onclick = function(){
    ensureAudio();
    startSession(this.getAttribute('data-mode'), false);
  };
}
$('btnAgain').onclick = function(){ startSession(session.mode, false); };
$('btnRetryWrong').onclick = function(){ startSession('en2zh', true); };
$('btnHome').onclick = function(){ show(el.menu); refreshMenu(); };
$('btnReview').onclick = function(){ renderReview(); };
$('btnCloseReview').onclick = function(){ show(el.menu); refreshMenu(); };
$('btnClearWrong').onclick = function(){
  if (!confirm('清空错词本？掌握的记录不受影响。')) return;
  for (var k in DB.rec){ if (DB.rec[k].w > 0) DB.rec[k].w = 0; }
  save(); renderReview(); refreshMenu();
};
$('btnSound').onclick = function(){
  opt.sound = !opt.sound;
  this.classList.toggle('on', opt.sound);
  save();
};
$('btnAuto').onclick = function(){
  opt.autoSpeak = !opt.autoSpeak;
  this.classList.toggle('on', opt.autoSpeak);
  save();
};

document.addEventListener('keydown', function(e){
  if (el.play.classList.contains('hidden')) return;
  if (cur && cur.mode === 'spell') return;   // 拼写模式交给输入框
  var n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4){ answer(n - 1); e.preventDefault(); }
});

/* ---------------- 主循环 ---------------- */
function loop(){
  tickTimer();
  rafId = requestAnimationFrame(loop);
}

/* ---------------- 启动 ---------------- */
load();
el.goalN.textContent = opt.goal;
$('btnSound').classList.toggle('on', opt.sound);
$('btnAuto').classList.toggle('on', opt.autoSpeak);
refreshMenu();
show(el.menu);
requestAnimationFrame(loop);

})();
</script>
</body>
