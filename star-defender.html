<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>星际守卫</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060f;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#e8f1ff;user-select:none;-webkit-user-select:none}
  #game{position:fixed;inset:0;overflow:hidden}
  canvas{position:absolute;inset:0;display:block;touch-action:none}

  .hud{position:absolute;top:0;left:0;right:0;padding:14px 16px calc(14px + env(safe-area-inset-top,0)) 16px;
    display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
  .hud-left,.hud-right{display:flex;flex-direction:column;gap:6px}
  .hud-right{align-items:flex-end}
  .score{font-size:28px;font-weight:800;letter-spacing:.5px;
    text-shadow:0 0 14px rgba(80,200,255,.65);font-variant-numeric:tabular-nums}
  .label{font-size:11px;opacity:.45;letter-spacing:2px}
  .wave{font-size:12px;opacity:.7;letter-spacing:1px;text-align:center;
    background:rgba(120,200,255,.09);border:1px solid rgba(120,200,255,.18);
    padding:3px 10px;border-radius:99px}
  .hud-mid{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;
    align-items:center;gap:8px}
  .combo{font-size:15px;font-weight:800;color:#ffd166;opacity:0;transition:opacity .18s;
    text-shadow:0 0 12px rgba(255,209,102,.7)}
  .combo.on{opacity:1}
  .lives{font-size:16px;letter-spacing:3px;color:#ff5b6e;text-shadow:0 0 10px rgba(255,91,110,.55)}
  .btns{display:flex;gap:8px;pointer-events:auto}
  .mini{width:34px;height:34px;border-radius:50%;border:1px solid rgba(150,200,255,.25);
    background:rgba(20,30,55,.55);color:#bcd8ff;font-size:12px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .mini:active{transform:scale(.93)}

  .layer{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:28px;
    background:radial-gradient(circle at 50% 40%,rgba(20,40,80,.55),rgba(4,5,12,.9) 70%);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .hidden{display:none!important}

  h1{font-size:clamp(34px,11vw,54px);font-weight:900;letter-spacing:.14em;
    background:linear-gradient(180deg,#bff0ff,#4fa8ff 55%,#2b5cff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(80,170,255,.55));margin-bottom:6px}
  .sub{font-size:13px;letter-spacing:.22em;opacity:.55;margin-bottom:34px}
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:800;
    font-size:17px;letter-spacing:.16em;color:#03121f;padding:15px 42px;border-radius:99px;
    background:linear-gradient(180deg,#7fe4ff,#2f9dff);
    box-shadow:0 0 0 1px rgba(160,230,255,.6),0 10px 34px rgba(47,157,255,.45);
    transition:transform .12s}
  .btn:active{transform:scale(.96)}
  .tip{margin-top:26px;font-size:12px;line-height:2;opacity:.4;letter-spacing:.06em}
  .best{margin-top:8px;font-size:13px;color:#ffd166;opacity:.85;letter-spacing:.1em}
  .big{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;
    text-shadow:0 0 26px rgba(80,200,255,.5);margin:4px 0 2px}
  .stat{font-size:12px;opacity:.5;letter-spacing:.16em;margin-bottom:30px}
  .over-title{font-size:22px;font-weight:800;letter-spacing:.3em;color:#ff8090;
    text-shadow:0 0 20px rgba(255,90,110,.6);margin-bottom:14px}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div class="hud">
    <div class="hud-left">
      <div class="score" id="score">0</div>
      <div class="label">SCORE</div>
    </div>
    <div class="hud-mid">
      <div class="wave" id="wave">第 1 波</div>
      <div class="combo" id="combo"></div>
    </div>
    <div class="hud-right">
      <div class="lives" id="lives">♥♥♥</div>
      <div class="btns">
        <button class="mini" id="btnSound" aria-label="音效">🔊</button>
        <button class="mini" id="btnPause" aria-label="暂停">❚❚</button>
      </div>
    </div>
  </div>

  <div class="layer" id="menu">
    <h1>星际守卫</h1>
    <p class="sub">S T A R &nbsp; D E F E N D E R</p>
    <button class="btn" id="btnStart">开 始</button>
    <p class="best" id="best"></p>
    <p class="tip">拖动屏幕移动 · 自动开火<br>吃掉掉落的道具升级火力</p>
  </div>

  <div class="layer hidden" id="pauseUI">
    <div class="over-title">暂 停</div>
    <button class="btn" id="btnResume">继 续</button>
    <p class="tip">按 P / ESC 也能继续</p>
  </div>

  <div class="layer hidden" id="overUI">
    <div class="over-title" id="overTitle">被 击 落</div>
    <div class="big" id="finalScore">0</div>
    <div class="stat">本次得分</div>
    <button class="btn" id="btnAgain">再 来 一 次</button>
    <p class="best" id="finalBest"></p>
  </div>
</div>

<script>
(function(){
'use strict';

var cv   = document.getElementById('cv');
var ctx  = cv.getContext('2d', { alpha: false });
var $    = function(id){ return document.getElementById(id); };

var menuUI = $('menu'), pauseUI = $('pauseUI'), overUI = $('overUI');
var elScore = $('score'), elWave = $('wave'), elLives = $('lives'), elCombo = $('combo');
var elBest = $('best'), elFinalScore = $('finalScore'), elFinalBest = $('finalBest'), elOverTitle = $('overTitle');

var TAU = Math.PI * 2;
function rnd(a, b){ return a + Math.random() * (b - a); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }

var W = 360, H = 640, DPR = 1;

/* ---------------- 存档 ---------------- */
var BEST_KEY = 'sd_best_v1', MUTE_KEY = 'sd_mute_v1';
function loadNum(k){
  try { var v = localStorage.getItem(k); return v ? parseInt(v, 10) || 0 : 0; } catch(e){ return 0; }
}
function saveNum(k, v){ try { localStorage.setItem(k, String(v)); } catch(e){} }
function loadMute(){ try { return localStorage.getItem(MUTE_KEY) === '1'; } catch(e){ return false; } }
function saveMute(v){ try { localStorage.setItem(MUTE_KEY, v ? '1' : '0'); } catch(e){} }

/* ---------------- 音效 ---------------- */
var actx = null, muted = loadMute();
function ensureAudio(){
  try {
    if (!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch(e){ actx = null; }
}
function tone(freq, dur, type, vol, slideTo){
  if (muted || !actx) return;
  try {
    var t0 = actx.currentTime;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch(e){}
}
var SFX = {
  shoot: function(){ tone(920, 0.045, 'square', 0.007, 560); },
  hit:   function(){ tone(340, 0.05, 'triangle', 0.022, 200); },
  boom:  function(){ tone(150, 0.26, 'sawtooth', 0.045, 45); },
  hurt:  function(){ tone(130, 0.32, 'sawtooth', 0.085, 50); },
  power: function(){ tone(540, 0.11, 'sine', 0.05, 1000); },
  boss:  function(){ tone(72, 0.55, 'sawtooth', 0.07, 48); },
  wave:  function(){ tone(680, 0.11, 'sine', 0.03, 920); }
};

/* ---------------- 状态 ---------------- */
var player = {
  x: 180, y: 560, tx: 180, ty: 560, r: 13,
  cool: 0, inv: 0, weapon: 1, shield: false
};

var G = {
  state: 'menu',
  t: 0, score: 0, best: loadNum(BEST_KEY),
  wave: 1, waveT: 0, lives: 3,
  combo: 1, comboT: 0,
  enemies: [], pb: [], eb: [], drops: [], parts: [], texts: [], stars: [],
  spawnT: 0, boss: null, shake: 0, flash: 0, banner: 0
};

var WAVE_TIME = 20;

/* ---------------- 自适应尺寸 ---------------- */
function initStars(){
  G.stars = [];
  var n = Math.round((W * H) / 9000);
  n = clamp(n, 40, 150);
  for (var i = 0; i < n; i++){
    var depth = Math.random();
    G.stars.push({
      x: rnd(0, W), y: rnd(0, H),
      s: 0.6 + depth * 1.9,
      v: 16 + depth * 90,
      a: 0.18 + depth * 0.62
    });
  }
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(300, window.innerWidth);
  H = Math.max(420, window.innerHeight);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initStars();
  player.x = clamp(player.x, 20, W - 20);
  player.y = clamp(player.y, 80, H - 20);
  player.tx = clamp(player.tx, 20, W - 20);
  player.ty = clamp(player.ty, 80, H - 20);
}

/* ---------------- 输入 ---------------- */
var pointerId = null;

function pointerPos(e){
  var rect = cv.getBoundingClientRect();
  var x = e.clientX - rect.left;
  var y = e.clientY - rect.top;
  if (e.pointerType === 'touch') y -= 52; // 手指别挡住飞船
  return { x: x, y: y };
}

function onDown(e){
  if (G.state !== 'play') return;
  ensureAudio();
  pointerId = e.pointerId;
  var p = pointerPos(e);
  player.tx = p.x; player.ty = p.y;
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  e.preventDefault();
}
function onMove(e){
  if (G.state !== 'play' || e.pointerId !== pointerId) return;
  var p = pointerPos(e);
  player.tx = p.x; player.ty = p.y;
  e.preventDefault();
}
function onUp(e){
  if (e.pointerId === pointerId) pointerId = null;
}

cv.addEventListener('pointerdown', onDown, { passive: false });
cv.addEventListener('pointermove', onMove, { passive: false });
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);

var keys = {};
window.addEventListener('keydown', function(e){
  keys[e.key] = true;
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape'){
    if (G.state === 'play') pauseGame();
    else if (G.state === 'pause') resumeGame();
  }
  if ((e.key === ' ' || e.key === 'Enter') && G.state === 'menu') startGame();
  if ((e.key === ' ' || e.key === 'Enter') && G.state === 'over') startGame();
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function(e){ keys[e.key] = false; });

/* ---------------- 粒子 / 文字 ---------------- */
function burst(x, y, color, count, power, size){
  for (var i = 0; i < count; i++){
    var a = rnd(0, TAU), sp = rnd(power * 0.25, power);
    G.parts.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: rnd(0.28, 0.75), max: 0.75,
      size: rnd(size * 0.5, size),
      color: color,
      drag: rnd(0.9, 0.97)
    });
  }
}
function floatText(x, y, txt, color, size){
  G.texts.push({ x: x, y: y, txt: txt, color: color || '#fff', size: size || 14, life: 0.85, max: 0.85 });
}

/* ---------------- 游戏流程 ---------------- */
function hideAll(){
  menuUI.classList.add('hidden');
  pauseUI.classList.add('hidden');
  overUI.classList.add('hidden');
}

function startGame(){
  ensureAudio();
  G.state = 'play';
  G.t = 0; G.score = 0; G.wave = 1; G.waveT = WAVE_TIME;
  G.lives = 3; G.combo = 1; G.comboT = 0;
  G.enemies.length = 0; G.pb.length = 0; G.eb.length = 0;
  G.drops.length = 0; G.parts.length = 0; G.texts.length = 0;
  G.spawnT = 0.7; G.boss = null; G.shake = 0; G.flash = 0; G.banner = 0;

  player.x = W / 2; player.y = H - 100;
  player.tx = player.x; player.ty = player.y;
  player.cool = 0; player.inv = 2; player.weapon = 1; player.shield = false;

  hideAll();
  updateHUD();
}

function pauseGame(){
  if (G.state !== 'play') return;
  G.state = 'pause';
  pauseUI.classList.remove('hidden');
}

function resumeGame(){
  if (G.state !== 'pause') return;
  G.state = 'play';
  pauseUI.classList.add('hidden');
}

function gameOver(){
  G.state = 'over';
  pointerId = null;
  if (G.score > G.best){
    G.best = G.score;
    saveNum(BEST_KEY, G.best);
    elOverTitle.textContent = '新 纪 录';
  } else {
    elOverTitle.textContent = '被 击 落';
  }
  elFinalScore.textContent = G.score;
  elFinalBest.textContent = '最高分 ' + G.best;
  overUI.classList.remove('hidden');
  updateHUD();
}

function hitPlayer(){
  if (player.inv > 0) return;
  if (player.shield){
    player.shield = false;
    player.inv = 1.3;
    G.shake = 10;
    SFX.hit();
    burst(player.x, player.y, '#7fe4ff', 18, 260, 3);
    floatText(player.x, player.y - 30, '护盾破碎', '#7fe4ff', 13);
    return;
  }
  G.lives--;
  player.inv = 2.2;
  player.weapon = Math.max(1, player.weapon - 1);
  G.combo = 1; G.comboT = 0;
  G.shake = 18; G.flash = 0.45;
  SFX.hurt();
  burst(player.x, player.y, '#ff5b6e', 30, 320, 4);
  updateHUD();
  if (G.lives <= 0){
    burst(player.x, player.y, '#ffd166', 60, 460, 5);
    gameOver();
  }
}

/* ---------------- 波次 / 生成 ---------------- */
function showBanner(){
  G.banner = 1.6;
  var t = '第 ' + G.wave + ' 波';
  if (G.boss) t = 'BOSS 来 袭';
  floatText(W / 2, H * 0.3, t, G.boss ? '#ff5b6e' : '#8fd4ff', 24);
}

function spawnEnemy(kind, x, y){
  var e = { kind: kind, x: x, y: y, t: 0, fireT: rnd(0.8, 1.6), hitFlash: 0, phase: rnd(0, TAU) };
  if (kind === 'grunt'){
    e.r = 13; e.hp = 1; e.vy = 105 + G.wave * 5; e.score = 10; e.baseX = x; e.amp = 0;
  } else if (kind === 'weaver'){
    e.r = 12; e.hp = 2; e.vy = 85 + G.wave * 4; e.score = 16; e.baseX = x; e.amp = rnd(30, 70);
  } else {
    e.r = 16; e.hp = 3; e.vy = 80 + G.wave * 3; e.score = 26; e.baseX = x; e.amp = rnd(0, 30);
  }
  G.enemies.push(e);
}

function spawnWaveEnemy(){
  var roll = Math.random();
  var kind = 'grunt';
  if (G.wave >= 3 && roll > 0.82) kind = 'gunner';
  else if (G.wave >= 2 && roll > 0.5) kind = 'weaver';

  var pad = kind === 'gunner' ? 60 : 40;
  var x = rnd(pad, W - pad);
  spawnEnemy(kind, x, -30);

  // 偶尔来个小队
  if (kind === 'grunt' && Math.random() < 0.3 && W > 340){
    var gap = 34;
    if (x + gap * 2 < W - 30){
      spawnEnemy('grunt', x + gap, -30);
      spawnEnemy('grunt', x + gap * 2, -30);
    }
  }
}

function spawnBoss(){
  var hp = 70 + G.wave * 16;
  G.boss = {
    x: W / 2, y: -90, r: 46, hp: hp, maxhp: hp,
    t: 0, fireT: 1.2, dir: Math.random() < 0.5 ? 1 : -1,
    entering: true, hitFlash: 0, score: 400 + G.wave * 40
  };
  G.eb.length = 0; // 清屏，迎接 boss
  SFX.boss();
  G.shake = 14;
  showBanner();
}

function addDrop(x, y){
  var r = Math.random();
  var kind = 'w';
  if (r > 0.72) kind = 's';
  else if (r > 0.88) kind = 'h';
  if (kind === 'h' && G.lives >= 5) kind = 'w';
  G.drops.push({ x: x, y: y, vy: 70, kind: kind, t: 0 });
}

/* ---------------- 开火 ---------------- */
function pb(x, y, vx, vy, dmg){
  G.pb.push({ x: x, y: y, vx: vx, vy: vy, r: 3, dmg: dmg || 1 });
}

function firePlayer(){
  var y = player.y - 16;
  if (player.weapon === 1){
    pb(player.x, y, 0, -780);
  } else if (player.weapon === 2){
    pb(player.x - 8, y, 0, -800);
    pb(player.x + 8, y, 0, -800);
  } else {
    pb(player.x, y - 6, 0, -840);
    pb(player.x - 11, y + 2, -190, -800);
    pb(player.x + 11, y + 2, 190, -800);
  }
  SFX.shoot();
}

/* ---------------- 更新 ---------------- */
function updateStars(dt){
  for (var i = 0; i < G.stars.length; i++){
    var s = G.stars[i];
    s.y += s.v * dt;
    if (s.y > H + 2){ s.y = -2; s.x = rnd(0, W); }
  }
}

function updateParts(dt){
  for (var i = G.parts.length - 1; i >= 0; i--){
    var p = G.parts[i];
    p.life -= dt;
    if (p.life <= 0){ G.parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    var d = Math.pow(p.drag, dt * 60);
    p.vx *= d; p.vy *= d;
  }
}

function updateTexts(dt){
  for (var i = G.texts.length - 1; i >= 0; i--){
    var t = G.texts[i];
    t.life -= dt;
    t.y -= 26 * dt;
    if (t.life <= 0) G.texts.splice(i, 1);
  }
}

function addCombo(){
  G.comboT = 1.8;
  G.combo = Math.min(5, G.combo + 0.5);
}

function killEnemy(e, idx){
  var gain = Math.round(e.score * G.combo);
  G.score += gain;
  floatText(e.x, e.y, '+' + gain, '#ffd166', 13);
  burst(e.x, e.y, e.kind === 'gunner' ? '#ffb347' : (e.kind === 'weaver' ? '#c084fc' : '#ff5b6e'), 14, 220, 3);
  G.shake = Math.min(14, G.shake + 3);
  SFX.boom();
  addCombo();
  if (Math.random() < (e.kind === 'gunner' ? 0.3 : 0.12)) addDrop(e.x, e.y);
  G.enemies.splice(idx, 1);
  updateHUD();
}

function updateEnemies(dt){
  for (var i = G.enemies.length - 1; i >= 0; i--){
    var e = G.enemies[i];
    e.t += dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;

    if (e.kind === 'weaver'){
      e.y += e.vy * dt;
      e.x = e.baseX + Math.sin(e.t * 2.2 + e.phase) * e.amp;
    } else if (e.kind === 'gunner'){
      if (e.y < H * 0.3) e.y += e.vy * dt;
      else {
        e.y += Math.sin(e.t * 1.5) * 12 * dt;
        e.fireT -= dt;
        if (e.fireT <= 0){
          e.fireT = Math.max(1.1, 2.0 - G.wave * 0.05);
          var dx = player.x - e.x, dy = player.y - e.y;
          var d = Math.hypot(dx, dy) || 1;
          var sp = 190;
          G.eb.push({ x: e.x, y: e.y + 10, vx: dx / d * sp, vy: dy / d * sp, r: 5 });
        }
      }
    } else {
      e.y += e.vy * dt;
    }

    e.x = clamp(e.x, e.r, W - e.r);

    if (e.y > H + 50){
      G.enemies.splice(i, 1);
      G.combo = 1; G.comboT = 0;
      continue;
    }

    // 撞机
    var dxp = e.x - player.x, dyp = e.y - player.y;
    var rr = e.r + player.r * 0.85;
    if (dxp * dxp + dyp * dyp < rr * rr){
      burst(e.x, e.y, '#ff5b6e', 20, 260, 3);
      G.enemies.splice(i, 1);
      hitPlayer();
      if (G.state !== 'play') return;
    }
  }
}

function updateBoss(dt){
  var b = G.boss;
  if (!b) return;
  b.t += dt;
  if (b.hitFlash > 0) b.hitFlash -= dt;

  if (b.entering){
    b.y += 90 * dt;
    if (b.y >= 110){ b.y = 110; b.entering = false; }
    return;
  }

  // 左右巡航
  b.x += b.dir * (70 + G.wave * 3) * dt;
  if (b.x > W - b.r - 8){ b.x = W - b.r - 8; b.dir = -1; }
  if (b.x < b.r + 8){ b.x = b.r + 8; b.dir = 1; }
  b.y = 110 + Math.sin(b.t * 1.4) * 14;

  b.fireT -= dt;
  if (b.fireT <= 0){
    b.fireT = Math.max(0.75, 1.7 - G.wave * 0.03);
    var mode = Math.floor(rnd(0, 2));
    if (mode === 0){
      // 环形弹幕
      var n = 12;
      var off = rnd(0, TAU);
      for (var k = 0; k < n; k++){
        var a = off + k / n * TAU;
        G.eb.push({ x: b.x, y: b.y + 10, vx: Math.cos(a) * 130, vy: Math.sin(a) * 130, r: 6 });
      }
    } else {
      // 三连瞄准
      var dx = player.x - b.x, dy = player.y - b.y;
      var base = Math.atan2(dy, dx);
      for (var j = -1; j <= 1; j++){
        var ang = base + j * 0.17;
        G.eb.push({ x: b.x, y: b.y + 10, vx: Math.cos(ang) * 215, vy: Math.sin(ang) * 215, r: 6 });
      }
    }
  }

  // 撞玩家
  var dxp = b.x - player.x, dyp = b.y - player.y;
  var rr = b.r * 0.75 + player.r;
  if (dxp * dxp + dyp * dyp < rr * rr) hitPlayer();
}

function damageBoss(dmg){
  var b = G.boss;
  if (!b) return;
  b.hp -= dmg;
  b.hitFlash = 0.08;
  if (b.hp <= 0){
    var gain = Math.round(b.score * G.combo);
    G.score += gain;
    floatText(b.x, b.y, '+' + gain, '#ffd166', 20);
    for (var i = 0; i < 5; i++){
      burst(b.x + rnd(-30, 30), b.y + rnd(-30, 30), i % 2 ? '#ffd166' : '#ff7a4d', 26, 400, 5);
    }
    G.shake = 30;
    SFX.boom();
    addDrop(b.x - 30, b.y);
    addDrop(b.x + 30, b.y);
    addDrop(b.x, b.y + 20);
    G.boss = null;
    G.eb.length = 0;
    updateHUD();
  }
}

function updateBullets(dt){
  // 我方子弹
  for (var i = G.pb.length - 1; i >= 0; i--){
    var p = G.pb[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y < -20 || p.x < -20 || p.x > W + 20){ G.pb.splice(i, 1); continue; }

    var hit = false;
    if (G.boss){
      var b = G.boss;
      var bdx = p.x - b.x, bdy = p.y - b.y;
      var br = b.r * 0.8;
      if (bdx * bdx + bdy * bdy < br * br){
        damageBoss(p.dmg);
        burst(p.x, p.y, '#bff0ff', 4, 120, 2);
        G.pb.splice(i, 1);
        hit = true;
      }
    }
    if (hit) continue;

    for (var j = G.enemies.length - 1; j >= 0; j--){
      var e = G.enemies[j];
      var dx = p.x - e.x, dy = p.y - e.y;
      var rr = e.r + p.r;
      if (dx * dx + dy * dy < rr * rr){
        e.hp -= p.dmg;
        e.hitFlash = 0.09;
        burst(p.x, p.y, '#bff0ff', 4, 110, 2);
        G.pb.splice(i, 1);
        if (e.hp <= 0) killEnemy(e, j);
        else SFX.hit();
        break;
      }
    }
  }

  // 敌方子弹
  for (var k = G.eb.length - 1; k >= 0; k--){
    var eb = G.eb[k];
    eb.x += eb.vx * dt; eb.y += eb.vy * dt;
    if (eb.y > H + 30 || eb.y < -40 || eb.x < -40 || eb.x > W + 40){
      G.eb.splice(k, 1); continue;
    }
    var ddx = eb.x - player.x, ddy = eb.y - player.y;
    var pr = eb.r + player.r * 0.78;
    if (ddx * ddx + ddy * ddy < pr * pr){
      G.eb.splice(k, 1);
      hitPlayer();
      if (G.state !== 'play') return;
    }
  }
}

function updateDrops(dt){
  for (var i = G.drops.length - 1; i >= 0; i--){
    var d = G.drops[i];
    d.t += dt;
    d.y += d.vy * dt;
    if (d.y > H - 26 && d.y < H - 30 + 200){
      // 慢慢飘向玩家一点，提高拾取手感
    }
    var dx = d.x - player.x, dy = d.y - player.y;
    if (dx * dx + dy * dy < 34 * 34){
      G.drops.splice(i, 1);
      applyDrop(d.kind, d.x, d.y);
      continue;
    }
    if (d.y > H + 30) G.drops.splice(i, 1);
  }
}

function applyDrop(kind, x, y){
  SFX.power();
  if (kind === 'w'){
    if (player.weapon < 3){
      player.weapon++;
      floatText(x, y - 12, '火力 ' + player.weapon, '#7fe4ff', 14);
    } else {
      G.score += 50;
      floatText(x, y - 12, '+50', '#ffd166', 14);
    }
    burst(x, y, '#7fe4ff', 12, 180, 3);
  } else if (kind === 's'){
    player.shield = true;
    floatText(x, y - 12, '护盾', '#8affc1', 14);
    burst(x, y, '#8affc1', 12, 180, 3);
  } else {
    G.lives = Math.min(5, G.lives + 1);
    floatText(x, y - 12, '生命 +1', '#ff8090', 14);
    burst(x, y, '#ff8090', 12, 180, 3);
    updateHUD();
  }
}

function updatePlayer(dt){
  // 键盘
  var kx = 0, ky = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) kx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) kx += 1;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) ky -= 1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) ky += 1;
  if (kx || ky){
    player.tx += kx * 460 * dt;
    player.ty += ky * 460 * dt;
  }

  player.tx = clamp(player.tx, 18, W - 18);
  player.ty = clamp(player.ty, 74, H - 22);

  var f = 1 - Math.exp(-16 * dt);
  player.x = lerp(player.x, player.tx, f);
  player.y = lerp(player.y, player.ty, f);

  if (player.inv > 0) player.inv -= dt;

  player.cool -= dt;
  if (player.cool <= 0){
    firePlayer();
    player.cool = player.weapon >= 3 ? 0.125 : 0.145;
  }
}

function updatePlay(dt){
  G.t += dt;

  if (G.comboT > 0){
    G.comboT -= dt;
    if (G.comboT <= 0){ G.combo = 1; }
  }

  if (!G.boss){
    G.waveT -= dt;
    if (G.waveT <= 0){
      G.wave++;
      G.waveT = WAVE_TIME;
      SFX.wave();
      showBanner();
      updateHUD();
      if (G.wave % 5 === 0){
        spawnBoss();
        return;
      }
    }
    G.spawnT -= dt;
    if (G.spawnT <= 0){
      spawnWaveEnemy();
      var base = Math.max(0.34, 0.98 - G.wave * 0.055);
      G.spawnT = base * rnd(0.75, 1.25);
    }
  }

  updatePlayer(dt);
  updateEnemies(dt);
  if (G.state !== 'play') return;
  updateBoss(dt);
  updateBullets(dt);
  if (G.state !== 'play') return;
  updateDrops(dt);
}

/* ---------------- HUD ---------------- */
var lastHud = '';
function updateHUD(){
  var key = G.score + '|' + G.wave + '|' + G.lives + '|' + G.combo;
  if (key === lastHud) return;
  lastHud = key;
  elScore.textContent = G.score;
  elWave.textContent = G.boss ? 'BOSS' : ('第 ' + G.wave + ' 波');
  var h = '';
  for (var i = 0; i < Math.max(0, G.lives); i++) h += '♥';
  elLives.textContent = h;
  if (G.combo > 1.2){
    elCombo.textContent = 'x' + (Math.round(G.combo * 10) / 10);
    elCombo.classList.add('on');
  } else {
    elCombo.classList.remove('on');
  }
}

/* ---------------- 绘制 ---------------- */
function drawStars(){
  for (var i = 0; i < G.stars.length; i++){
    var s = G.stars[i];
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#cfe6ff';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}

function drawPlayer(){
  var p = player;
  if (p.inv > 0 && Math.floor(p.inv * 14) % 2 === 0) return;

  // 尾焰
  var flame = 10 + Math.sin(G.t * 40) * 3;
  var grad = ctx.createLinearGradient(p.x, p.y + 8, p.x, p.y + 8 + flame * 2.2);
  grad.addColorStop(0, 'rgba(120,230,255,.85)');
  grad.addColorStop(0.5, 'rgba(60,150,255,.35)');
  grad.addColorStop(1, 'rgba(60,150,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(p.x - 6, p.y + 8);
  ctx.lineTo(p.x + 6, p.y + 8);
  ctx.lineTo(p.x, p.y + 8 + flame * 2.2);
  ctx.closePath();
  ctx.fill();

  // 机身
  var bg = ctx.createLinearGradient(p.x, p.y - p.r, p.x, p.y + p.r);
  bg.addColorStop(0, '#e9fbff');
  bg.addColorStop(0.45, '#63c8ff');
  bg.addColorStop(1, '#1d6fd6');
  ctx.fillStyle = bg;
  ctx.shadowColor = 'rgba(90,200,255,.9)';
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y - p.r - 4);
  ctx.lineTo(p.x + p.r * 0.85, p.y + p.r * 0.62);
  ctx.lineTo(p.x, p.y + p.r * 0.22);
  ctx.lineTo(p.x - p.r * 0.85, p.y + p.r * 0.62);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // 驾驶舱
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y - 2, 3, 5, 0, 0, TAU);
  ctx.fill();

  // 护盾
  if (p.shield){
    ctx.strokeStyle = 'rgba(138,255,193,' + (0.5 + Math.sin(G.t * 6) * 0.22) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 11, 0, TAU);
    ctx.stroke();
  }
}

function drawEnemy(e){
  var flash = e.hitFlash > 0;
  ctx.save();
  ctx.translate(e.x, e.y);

  if (e.kind === 'weaver'){
    ctx.fillStyle = flash ? '#ffffff' : '#c084fc';
    ctx.shadowColor = 'rgba(192,132,252,.8)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, -e.r); ctx.lineTo(e.r, 0);
    ctx.lineTo(0, e.r); ctx.lineTo(-e.r, 0);
    ctx.closePath();
    ctx.fill();
  } else if (e.kind === 'gunner'){
    ctx.fillStyle = flash ? '#ffffff' : '#ffb347';
    ctx.shadowColor = 'rgba(255,179,71,.8)';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(-e.r, -e.r * 0.55);
    ctx.lineTo(0, -e.r);
    ctx.lineTo(e.r, -e.r * 0.55);
    ctx.lineTo(e.r * 0.62, e.r);
    ctx.lineTo(-e.r * 0.62, e.r);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(40,20,0,.55)';
    ctx.beginPath();
    ctx.arc(0, 0, e.r * 0.34, 0, TAU);
    ctx.fill();
  } else {
    ctx.fillStyle = flash ? '#ffffff' : '#ff5b6e';
    ctx.shadowColor = 'rgba(255,91,110,.8)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, e.r);
    ctx.lineTo(e.r, -e.r * 0.75);
    ctx.lineTo(0, -e.r * 0.3);
    ctx.lineTo(-e.r, -e.r * 0.75);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawBoss(){
  var b = G.boss;
  if (!b) return;
  ctx.save();
  ctx.translate(b.x, b.y);
  var flash = b.hitFlash > 0;

  // 外环
  ctx.strokeStyle = 'rgba(255,90,110,' + (0.35 + Math.sin(b.t * 3) * 0.15) + ')';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, b.r + 10, 0, TAU);
  ctx.stroke();

  // 主体
  var g = ctx.createRadialGradient(0, -10, 6, 0, 0, b.r);
  g.addColorStop(0, flash ? '#ffffff' : '#ff9db0');
  g.addColorStop(0.55, flash ? '#ffd0d8' : '#c2304a');
  g.addColorStop(1, flash ? '#ffb0bd' : '#4a0a18');
  ctx.fillStyle = g;
  ctx.shadowColor = 'rgba(255,70,100,.8)';
  ctx.shadowBlur = 26;
  ctx.beginPath();
  for (var i = 0; i < 6; i++){
    var a = -Math.PI / 2 + i / 6 * TAU;
    var px = Math.cos(a) * b.r, py = Math.sin(a) * b.r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // 核心
  var pulse = 0.55 + Math.sin(b.t * 5) * 0.25;
  ctx.fillStyle = 'rgba(255,235,150,' + pulse + ')';
  ctx.beginPath();
  ctx.arc(0, 0, b.r * 0.32, 0, TAU);
  ctx.fill();

  // 侧翼炮
  ctx.fillStyle = '#3a0d1a';
  ctx.fillRect(-b.r * 0.95, -6, 10, 22);
  ctx.fillRect(b.r * 0.95 - 10, -6, 10, 22);
  ctx.restore();
}

function drawBullets(){
  // 我方
  for (var i = 0; i < G.pb.length; i++){
    var p = G.pb[i];
    ctx.fillStyle = '#bff0ff';
    ctx.shadowColor = 'rgba(120,220,255,.95)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 2.6, 7, 0, 0, TAU);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // 敌方
  for (var j = 0; j < G.eb.length; j++){
    var e = G.eb[j];
    ctx.fillStyle = '#ff6b7f';
    ctx.shadowColor = 'rgba(255,90,120,.9)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,230,235,.9)';
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r * 0.42, 0, TAU);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function drawDrops(){
  for (var i = 0; i < G.drops.length; i++){
    var d = G.drops[i];
    var col = d.kind === 'w' ? '#7fe4ff' : (d.kind === 's' ? '#8affc1' : '#ff8090');
    var ch  = d.kind === 'w' ? 'W' : (d.kind === 's' ? 'S' : '+');
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(Math.sin(d.t * 3) * 0.35);
    ctx.shadowColor = col;
    ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(8,14,28,.85)';
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(-11, -11, 22, 22);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = col;
    ctx.font = 'bold 13px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ch, 0, 1);
    ctx.restore();
  }
}

function drawParts(){
  for (var i = 0; i < G.parts.length; i++){
    var p = G.parts[i];
    var a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a + 0.6, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTexts(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < G.texts.length; i++){
    var t = G.texts[i];
    var a = Math.max(0, t.life / t.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = t.color;
    ctx.font = '800 ' + t.size + 'px system-ui,-apple-system,sans-serif';
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 12;
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawBossBar(){
  var b = G.boss;
  if (!b) return;
  var w = Math.min(W - 80, 340);
  var x = (W - w) / 2, y = 96;
  ctx.fillStyle = 'rgba(255,255,255,.1)';
  ctx.fillRect(x, y, w, 6);
  var pct = clamp(b.hp / b.maxhp, 0, 1);
  var g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#ff5b6e');
  g.addColorStop(1, '#ffd166');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w * pct, 6);
}

function render(){
  ctx.fillStyle = '#05060f';
  ctx.fillRect(0, 0, W, H);

  // 星云
  var neb = ctx.createRadialGradient(W * 0.25, H * 0.15, 0, W * 0.25, H * 0.15, H * 0.62);
  neb.addColorStop(0, 'rgba(30,70,150,.22)');
  neb.addColorStop(1, 'rgba(30,70,150,0)');
  ctx.fillStyle = neb;
  ctx.fillRect(0, 0, W, H);
  var neb2 = ctx.createRadialGradient(W * 0.8, H * 0.75, 0, W * 0.8, H * 0.75, H * 0.55);
  neb2.addColorStop(0, 'rgba(90,40,130,.16)');
  neb2.addColorStop(1, 'rgba(90,40,130,0)');
  ctx.fillStyle = neb2;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (G.shake > 0.4){
    ctx.translate(rnd(-G.shake, G.shake) * 0.5, rnd(-G.shake, G.shake) * 0.5);
  }

  drawStars();
  drawDrops();
  for (var i = 0; i < G.enemies.length; i++) drawEnemy(G.enemies[i]);
  drawBoss();
  drawBullets();
  if (G.state !== 'menu') drawPlayer();
  drawParts();
  drawTexts();
  ctx.restore();

  drawBossBar();

  if (G.flash > 0){
    ctx.fillStyle = 'rgba(255,60,80,' + (G.flash * 0.45) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------------- 主循环 ---------------- */
var last = performance.now();

function frame(now){
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  updateStars(dt);
  updateParts(dt);
  updateTexts(dt);

  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 60);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.2);

  if (G.state === 'play'){
    updatePlay(dt);
    updateHUD();
  }

  render();
  requestAnimationFrame(frame);
}

/* ---------------- 按钮 ---------------- */
$('btnStart').addEventListener('click', function(){ startGame(); });
$('btnAgain').addEventListener('click', function(){ startGame(); });
$('btnResume').addEventListener('click', function(){ resumeGame(); });
$('btnPause').addEventListener('click', function(){
  if (G.state === 'play') pauseGame();
  else if (G.state === 'pause') resumeGame();
});

var btnSound = $('btnSound');
btnSound.textContent = muted ? '🔇' : '🔊';
btnSound.addEventListener('click', function(){
  muted = !muted;
  saveMute(muted);
  btnSound.textContent = muted ? '🔇' : '🔊';
  if (!muted){ ensureAudio(); SFX.power(); }
});

document.addEventListener('visibilitychange', function(){
  if (document.hidden && G.state === 'play') pauseGame();
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 260); });

/* ---------------- 启动 ---------------- */
resize();
elBest.textContent = '最高分 ' + G.best;
menuUI.classList.remove('hidden');
updateHUD();
requestAnimationFrame(frame);

})();
</script>
